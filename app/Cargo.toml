[package]
name = "cubicai-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cubic-gguf = { path = "../crates/gguf" }
cubic-gateway = { path = "../crates/gateway" }
qrcode = { version = "0.14", default-features = false }
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_commonmark = "0.26"
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
memmap2 = "0.9"
keyring = "4.2"
nvml-wrapper = "0.13"
rfd = "0.17"
flate2 = "1.1"
tar = "0.4"
zip = "9.4"
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
half = "2.7"
rqrr = "0.10"
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
